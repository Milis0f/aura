[project]
name = "aura"
version = "0.2.0"
description = "Home media appliance for a Mac mini or any PC on Linux: live TV, films and series from plugged drives, NAS file manager, downloads, phone remote."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "websockets>=12",
  "python-multipart>=0.0.9",
  "yt-dlp[default]>=2026.8.19",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
aura = "aura.main:run"
aura-manage = "aura.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aura"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
