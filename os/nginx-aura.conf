# /etc/nginx/sites-available/aura — optional: reach Aura from the Internet over HTTPS.
# Replace aura.example.org with your domain, then:
#
#   ln -s /etc/nginx/sites-available/aura /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d aura.example.org
#
# Aura treats every request relayed here (X-Forwarded-For) as coming from the Internet: only the sign-in page
# answers without an account, the TV remote and the file manager need one. qBittorrent (8080) and the Chrome
# debugging port stay on the machine.

limit_req_zone $binary_remote_addr zone=aura_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=aura_api:10m   rate=30r/s;
limit_conn_zone $binary_remote_addr zone=aura_conn:10m;

map $http_upgrade $aura_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name aura.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aura.example.org;

    # Filled in by certbot
    # ssl_certificate     /etc/letsencrypt/live/aura.example.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/aura.example.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    # Uploads and film streams: no size limit, no buffering, long transfers
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;

    limit_conn aura_conn 20;

    location = /api/login {
        limit_req zone=aura_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live updates for the web app and the phone remote
    location = /api/ws {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $aura_connection;
    }

    location /api/ {
        limit_req zone=aura_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
