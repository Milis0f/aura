# Debian 13 (trixie) preseed for an unattended Aura appliance install.
# Usage: copy to a USB key next to the netinstall ISO's boot, or append to the kernel command line:
#   auto=true priority=critical url=http://<your-pc-ip>:8000/aura.cfg
# Wi-Fi is NOT available during install on the Mac mini 2012 (b43 firmware is non-free): use Ethernet.
d-i debian-installer/locale string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr(latin9)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string aura
d-i netcfg/get_domain string local
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Aura admin
d-i passwd/username string admin
# Change this password after the first boot: passwd
d-i passwd/user-password password aura
d-i passwd/user-password-again password aura
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Paris
d-i clock-setup/ntp boolean true
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string curl git sudo network-manager
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default
d-i finish-install/reboot_in_progress note
# Run the Aura installer on first boot
d-i preseed/late_command string \
  in-target sh -c 'echo "admin ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/admin'; \
  in-target sh -c 'printf "[Unit]\nDescription=Aura first boot install\nAfter=network-online.target\nWants=network-online.target\nConditionPathExists=!/opt/aura/.venv\n[Service]\nType=oneshot\nExecStart=/bin/sh -c \"curl -fsSL https://raw.githubusercontent.com/matteo-pollo/aura/main/os/install.sh | bash\"\n[Install]\nWantedBy=multi-user.target\n" > /etc/systemd/system/aura-firstboot.service'; \
  in-target systemctl enable aura-firstboot.service
