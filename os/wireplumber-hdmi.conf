# Prefer the HDMI output as default sink (Mac mini 2012: Intel HDA HDMI on the HD 4000).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*hdmi.*" } ]
    actions = { update-props = { priority.session = 2000, priority.driver = 2000, node.description = "HDMI" } }
  }
  {
    matches = [ { node.name = "~alsa_output.*analog.*" } ]
    actions = { update-props = { priority.session = 500, priority.driver = 500 } }
  }
]
